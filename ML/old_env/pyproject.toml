[project]
name = "kotodexstract"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.121.0",
    "h5py>=3.15.1",
    "httpx>=0.28.1",
    "ijson>=3.4.0.post0",
    "json-lines>=0.5.0",
    "nltk>=3.9.2",
    "numpy>=2.3.4",
    "orjson>=3.11.4",
    "pandas>=2.3.3",
    "pymupdf>=1.26.5",
    "pytest>=8.4.2",
    "requests>=2.32.5",
    "sentence-transformers>=5.1.2",
    "torch>=2.8.0",
    "tqdm>=4.67.1",
    "transformers>=4.57.1",
    "uvicorn>=0.38.0",
]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true




[tool.uv.sources]
torch = [
  { index = "pytorch-cu129", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu129", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[dependency-groups]
dev = [
    "ruff>=0.11.5",
]
