[project]
name = "kotodex"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python =  ">=3.12, <3.13"
dependencies = [
    "accelerate>=1.11.0",
    "bertopic>=0.17.3",
    "bitsandbytes>=0.48.2", # Важно для LoRA
    "fastapi>=0.121.0",
    "flagembedding>=1.3.5",
    "httpx>=0.28.1",
    "huggingface-hub[hf-xet]>=0.36.0",
    "json-lines>=0.5.0",
    "nltk>=3.9.2",
    "numpy>=2.3.4",
    "orjson>=3.11.4",
    "pandas>=2.3.3",
    "peft>=0.17.1",
    "pymupdf>=1.26.5",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "scipy>=1.11.0",
    "sentence-transformers>=5.1.2",
    "tokenizers>=0.22.1",
    "torch==2.8.0",
    "tqdm>=4.67.1",
    "transformers[torch]>=4.35.0",
    "uvicorn>=0.38.0",
    "llama-cpp-python",
    "arxiv>=2.3.1",
    "ollama>=0.6.1",
]


[[tool.uv.index]]
name = "llama-cpp-whl"
url = "https://abetlen.github.io/llama-cpp-python/whl/cpu"
explicit = true


[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true




[tool.uv.sources]
torch = [
  { index = "pytorch-cu129", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu129", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
llama-cpp-python = [
    { index = "llama-cpp-whl" }
]
[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.11.5",
]
