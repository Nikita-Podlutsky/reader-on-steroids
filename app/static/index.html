<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Котодекс: Статичный Граф</title>
    <script src="https://unpkg.com/force-graph"></script>
    <style>
        body { margin: 0; background: #050505; color: #eee; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        
        #search-overlay {
            position: absolute; top: 20px; left: 20px; z-index: 100;
            background: rgba(0,0,0,0.85); padding: 15px; border-radius: 12px;
            border: 1px solid #333; display: flex; gap: 10px; align-items: center;
            backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        #search-input {
            background: #1a1a1a; color: #fff; border: 1px solid #444;
            padding: 12px; border-radius: 6px; width: 300px; font-size: 16px; outline: none;
        }
        #search-input:focus { border-color: #00ff88; }
        button {
            background: #00ff88; border: none; padding: 12px 25px; color: #000;
            border-radius: 6px; cursor: pointer; font-weight: 800; letter-spacing: 1px;
            transition: all 0.2s;
        }
        button:hover { background: #00cc6a; transform: scale(1.05); }
        
        /* SIDEBAR */
        #sidebar {
            position: absolute; right: 0; top: 0; bottom: 0; width: 450px;
            background: #111; border-left: 1px solid #222;
            transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
            display: flex; flex-direction: column; z-index: 90; 
            box-shadow: -10px 0 40px rgba(0,0,0,0.8);
        }
        #sidebar.open { transform: translateX(0); }
        
        .msg { padding: 12px; margin-bottom: 10px; border-radius: 8px; font-size: 0.95rem; line-height: 1.5; }
        .msg.user { background: #333; align-self: flex-end; margin-left: 20px; }
        .msg.ai { background: #0f2a1f; border-left: 3px solid #00ff88; margin-right: 20px; }
        
        /* LEGEND */
        #legend { 
            position: absolute; bottom: 30px; left: 30px; z-index: 95; 
            display: flex; flex-wrap: wrap; gap: 8px; max-width: 600px;
        }
        .legend-tag { 
            display: inline-flex; align-items: center; gap: 8px; 
            background: rgba(0,0,0,0.85); padding: 10px 16px; 
            border-radius: 20px; border: 1px solid #444;
            backdrop-filter: blur(10px);
        }
        .legend-dot {
            width: 12px; height: 12px; border-radius: 50%;
            box-shadow: 0 0 10px currentColor;
        }
        .legend-name {
            color: #ddd; font-size: 13px; font-weight: 600;
        }
    </style>
</head>
<body>

    <div id="search-overlay">
        <div style="font-weight:900; color:#00ff88; font-size: 20px;">KOTODEX</div>
        <input type="text" id="search-input" placeholder="Введите научную тему..." onkeypress="handleKey(event)">
        <button onclick="runSearch()" id="search-btn">НАЙТИ</button>
    </div>

    <div id="graph"></div>
    <div id="legend"></div>

    <div id="sidebar">
        <div style="padding:20px; border-bottom:1px solid #333; display:flex; justify-content:space-between; align-items:center; background:#151515;">
            <h3 style="margin:0; font-size:16px; color:#00ff88; max-width:350px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;" id="sb-title">Статья</h3>
            <button onclick="closeSidebar()" style="background:transparent; color:#666; padding:5px; border:1px solid #333;">✕</button>
        </div>
        <div style="flex:1; overflow-y:auto; padding:20px;">
            <div style="font-size:11px; color:#666; margin-bottom:5px; font-weight:bold;">АННОТАЦИЯ</div>
            <div id="sb-abstract" style="background:#1a1a1a; padding:15px; border-radius:8px; color:#ccc; line-height:1.6; font-size:14px; border-left:3px solid #444;">...</div>
            
            <div style="margin-top:30px; font-size:11px; color:#666; font-weight:bold;">AI АССИСТЕНТ</div>
            <div id="chat-history" style="height:300px; overflow-y:auto; margin-top:10px; display:flex; flex-direction:column;"></div>
        </div>
        <div style="padding:20px; background:#151515; border-top:1px solid #333; display:flex; gap:10px;">
            <input id="chat-input" type="text" placeholder="Вопрос по статье..." style="flex:1; background:#222; border:none; padding:12px; color:white; border-radius:6px;">
            <button onclick="sendChat()" style="padding:0 15px;">➤</button>
        </div>
    </div>

    <script>
        let allData = { nodes: [], links: [], topics: [] };
        let visibleNodeIds = new Set();
        let currentPaper = null;
        let chatHistory = [];

        // Инициализация графа с правильными настройками
        const Graph = ForceGraph()
            (document.getElementById('graph'))
            .backgroundColor('#050505')
            .nodeLabel(node => `<div style="background:rgba(0,0,0,0.9); padding:8px; border-radius:4px; max-width:200px;">${node.label}</div>`)
            .nodeColor(n => n.color)
            .nodeVal(n => n.val || 8) // Размер узла
            .nodeRelSize(0.2) // Базовый множитель размера
            .linkColor(() => '#333')
            .linkWidth(1.5)
            .onNodeClick(handleNodeClick)
            .d3Force('charge', null) // Отключаем отталкивание
            .d3Force('link', null)   // Отключаем притяжение связей
            .d3Force('center', null) // Отключаем центрирование
            .cooldownTicks(0)        // Сразу останавливаем симуляцию
            .warmupTicks(0);         // Не прогреваем

        async function runSearch() {
            const query = document.getElementById('search-input').value;
            if (!query) return;

            const btn = document.getElementById('search-btn');
            btn.innerText = "⏳"; btn.disabled = true;

            try {
                const res = await fetch('/analyze_graph', {
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ query })
                });
                const data = await res.json();
                
                console.log('Received data:', data); // Debug
                
                if(data.nodes.length === 0) {
                    alert("Ничего не найдено.");
                } else {
                    allData = data;
                    visibleNodeIds.clear();

                    // Показываем только корневые узлы (лидеров тем)
                    allData.nodes.forEach(n => {
                        // ВАЖНО: проверяем что координаты существуют
                        if (n.x === undefined || n.y === undefined) {
                            console.warn('Node without coords:', n);
                            n.x = Math.random() * 400 - 200;
                            n.y = Math.random() * 400 - 200;
                        }
                        
                        // Фиксируем позицию
                        n.fx = n.x; 
                        n.fy = n.y;
                        
                        if (n.is_root) {
                            visibleNodeIds.add(n.id);
                        }
                    });

                    console.log('Visible root nodes:', visibleNodeIds.size); // Debug
                    updateGraph();
                    buildLegend(data.topics || []);
                }
            } catch (e) { 
                console.error('Search error:', e); 
                alert("Ошибка сервера: " + e.message); 
            }
            
            btn.innerText = "НАЙТИ"; btn.disabled = false;
        }

        function updateGraph() {
            // Фильтруем узлы
            const nodes = allData.nodes.filter(n => visibleNodeIds.has(n.id));
            
            // Фильтруем связи
            const links = allData.links.filter(l => {
                const sourceId = typeof l.source === 'object' ? l.source.id : l.source;
                const targetId = typeof l.target === 'object' ? l.target.id : l.target;
                return visibleNodeIds.has(sourceId) && visibleNodeIds.has(targetId);
            });

            console.log('Updating graph:', nodes.length, 'nodes,', links.length, 'links');
            Graph.graphData({ nodes, links });
            
            // Центрируем камеру
            if (nodes.length > 0) {
                Graph.zoomToFit(400, 50);
            }
        }

        function handleNodeClick(node) {
            // 1. Открываем сайдбар
            openSidebar(node);

            // 2. Раскрываем соседей
            const neighbors = allData.links
                .filter(l => {
                    const s = (typeof l.source === 'object') ? l.source.id : l.source;
                    const t = (typeof l.target === 'object') ? l.target.id : l.target;
                    return s === node.id || t === node.id;
                })
                .map(l => {
                    const s = (typeof l.source === 'object') ? l.source.id : l.source;
                    const t = (typeof l.target === 'object') ? l.target.id : l.target;
                    return s === node.id ? t : s;
                });

            let added = false;
            neighbors.forEach(nid => {
                if (!visibleNodeIds.has(nid)) {
                    visibleNodeIds.add(nid);
                    added = true;
                }
            });

            if (added) {
                allData.nodes.forEach(n => {
                    if (visibleNodeIds.has(n.id)) {
                        n.fx = n.x; 
                        n.fy = n.y;
                    }
                });
                updateGraph();
            }
        }

        function buildLegend(topics) {
            const div = document.getElementById('legend');
            if (!topics || topics.length === 0) {
                div.innerHTML = '';
                return;
            }
            
            div.innerHTML = topics.map(t => `
                <div class="legend-tag">
                    <div class="legend-dot" style="background:${t.color};"></div>
                    <span class="legend-name">${t.name}</span>
                </div>
            `).join('');
        }

        async function openSidebar(node) {
            currentPaper = node;
            document.getElementById('sidebar').classList.add('open');
            document.getElementById('sb-title').innerText = node.label;
            
            const absBox = document.getElementById('sb-abstract');
            absBox.innerText = "Перевод...";
            absBox.style.opacity = "0.5";
            
            document.getElementById('chat-history').innerHTML = '';
            chatHistory = [];

            try {
                const res = await fetch('/translate', {
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ text: node.abstract })
                });
                const data = await res.json();
                absBox.innerText = data.translation || node.abstract;
                absBox.style.opacity = "1";
            } catch(e) { 
                console.error('Translation error:', e);
                absBox.innerText = node.abstract;
                absBox.style.opacity = "1";
            }
        }

        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
        }

        async function sendChat() {
            const input = document.getElementById('chat-input');
            const val = input.value.trim();
            if(!val) return;
            
            const hDiv = document.getElementById('chat-history');
            hDiv.innerHTML += `<div class="msg user">${val}</div>`;
            input.value = '';
            
            try {
                const res = await fetch('/chat', {
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ 
                        paper_text: currentPaper.full_text || currentPaper.abstract, 
                        history: chatHistory, 
                        question: val 
                    })
                });
                const data = await res.json();
                hDiv.innerHTML += `<div class="msg ai">${data.answer}</div>`;
                chatHistory.push(
                    {role:"user", content:val}, 
                    {role:"assistant", content:data.answer}
                );
                hDiv.scrollTop = hDiv.scrollHeight;
            } catch(e) {
                console.error('Chat error:', e);
                hDiv.innerHTML += `<div class="msg ai">Ошибка: ${e.message}</div>`;
            }
        }
        
        function handleKey(e) { 
            if(e.key === 'Enter') runSearch(); 
        }
    </script>
</body>
</html>
