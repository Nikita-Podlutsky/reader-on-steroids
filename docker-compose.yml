version: '3.9'

services:

  backend:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: kotodex-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - arxiv_pdfs:/app/arxiv_pdfs
      - ./checkpoints:/app/checkpoints:ro
    environment:
      - DEVICE=cuda
      - OLLAMA_HOST=http://host.docker.internal:11434
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GOOGLE_AI_STUDIO_API_KEY=${GOOGLE_AI_STUDIO_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 120s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kotodex-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  arxiv_pdfs: